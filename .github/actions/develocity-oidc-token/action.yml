name: 'Get GitHub OIDC token for Develocity'
description: 'Mint a GitHub OIDC token for solutions.develocity.cloud, in the `host=token` access key form'

inputs:
  access-key-env:
    description: 'Name of an env var to also export the access key to, for the following steps'
    required: false
    default: ''

outputs:
  access-key:
    description: 'The OIDC token, as `solutions.develocity.cloud=<token>`'
    value: ${{ steps.oidc.outputs.access-key }}

runs:
  using: "composite"
  steps:
    - name: Get GitHub OIDC token
      id: oidc
      shell: bash
      env:
        ACCESS_KEY_ENV: ${{ inputs.access-key-env }}
      run: |
        if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
          echo "::error::No GitHub OIDC token available, the job needs the 'id-token: write' permission"
          exit 1
        fi
        token=$(curl -sSfG -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          --data-urlencode "audience=https://solutions.develocity.cloud" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
        echo "::add-mask::$token"
        echo "access-key=solutions.develocity.cloud=$token" >> "$GITHUB_OUTPUT"
        if [ -n "$ACCESS_KEY_ENV" ]; then
          echo "$ACCESS_KEY_ENV=solutions.develocity.cloud=$token" >> "$GITHUB_ENV"
        fi
