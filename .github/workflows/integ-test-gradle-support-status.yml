name: Test Gradle support status reporting

on:
  workflow_call:
    inputs:
      cache-key-prefix:
        type: string
        default: '0'
      skip-dist:
        type: boolean
        default: false

env:
  SKIP_DIST: ${{ inputs.skip-dist }}
  GRADLE_BUILD_ACTION_CACHE_KEY_PREFIX: gradle-support-status-${{ inputs.cache-key-prefix }}

permissions:
  contents: read

jobs:
  report-outdated-versions:
    runs-on: ubuntu-latest
    outputs:
      known-latest: ${{ steps.versions.outputs.known-latest }}
      unmaintained: ${{ steps.versions.outputs.unmaintained }}
      unpatched: ${{ steps.versions.outputs.unpatched }}
      maintenance: ${{ steps.versions.outputs.maintenance }}
    steps:
    - name: Checkout sources
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Initialize integ-test
      uses: ./.github/actions/init-integ-test

    # Derived from the bundled release data so the expectations cannot drift from the action's own view.
    - name: Determine versions for each support status
      id: versions
      run: |
        set -euo pipefail
        eval "$(jq -r '
          [ .[].version
            | select(test("^[0-9]+\\.[0-9]+(\\.[0-9]+)?$"))
            | {v: ., k: (((split(".") | map(tonumber)) + [0, 0, 0]) | .[0:3])}
          ]
          | sort_by(.k) as $finals
          | ($finals | last) as $latest
          | [$finals[] | select(.k[0] == $latest.k[0] - 1)] as $prev
          | [$prev[] | select(.k[1] == ($prev | last | .k[1]))] as $line
          | "KNOWN_LATEST=\($latest.v)",
            "UNMAINTAINED=\($prev | first | .v)",
            "MAINTENANCE=\($line | last | .v)",
            "UNPATCHED=\(if ($line | length) > 1 then ($line | first | .v) else "" end)"
        ' sources/src/wrapper-validation/wrapper-checksums.json)"

        echo "Known latest : ${KNOWN_LATEST}"
        echo "Unmaintained : ${UNMAINTAINED}"
        echo "Unpatched    : ${UNPATCHED:-(none: the maintained line has a single release)}"
        echo "Maintenance  : ${MAINTENANCE}"

        {
          echo "known-latest=${KNOWN_LATEST}"
          echo "unmaintained=${UNMAINTAINED}"
          echo "unpatched=${UNPATCHED}"
          echo "maintenance=${MAINTENANCE}"
        } >> "$GITHUB_OUTPUT"

    - name: Setup Gradle with an end-of-life version
      uses: ./setup-gradle
      with:
        cache-read-only: false
        gradle-version: '7.6.4'
    - name: Build with the end-of-life version
      working-directory: .github/workflow-samples/no-wrapper
      run: gradle help "-DgradleVersionCheck=7.6.4"

    - name: Setup Gradle with an unmaintained version
      uses: ./setup-gradle
      with:
        gradle-version: ${{ steps.versions.outputs.unmaintained }}
    - name: Build with the unmaintained version
      working-directory: .github/workflow-samples/no-wrapper
      run: gradle help "-DgradleVersionCheck=${{ steps.versions.outputs.unmaintained }}"

    - name: Setup Gradle with an unpatched version
      if: ${{ steps.versions.outputs.unpatched != '' }}
      uses: ./setup-gradle
      with:
        gradle-version: ${{ steps.versions.outputs.unpatched }}
    - name: Build with the unpatched version
      if: ${{ steps.versions.outputs.unpatched != '' }}
      working-directory: .github/workflow-samples/no-wrapper
      run: gradle help "-DgradleVersionCheck=${{ steps.versions.outputs.unpatched }}"

    - name: Setup Gradle with the maintained version
      uses: ./setup-gradle
      with:
        gradle-version: ${{ steps.versions.outputs.maintenance }}
    - name: Build with the maintained version
      working-directory: .github/workflow-samples/no-wrapper
      run: gradle help "-DgradleVersionCheck=${{ steps.versions.outputs.maintenance }}"

  verify-report:
    needs: report-outdated-versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
    - name: Check the support-status report was emitted
      env:
        GH_TOKEN: ${{ github.token }}
        KNOWN_LATEST: ${{ needs.report-outdated-versions.outputs.known-latest }}
        UNMAINTAINED: ${{ needs.report-outdated-versions.outputs.unmaintained }}
        UNPATCHED: ${{ needs.report-outdated-versions.outputs.unpatched }}
        MAINTENANCE: ${{ needs.report-outdated-versions.outputs.maintenance }}
      run: |
        set -euo pipefail

        job_id=$(gh api \
          "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs" \
          --paginate --jq '.jobs[] | select(.name | endswith("report-outdated-versions")) | .id')
        if [ -z "$job_id" ]; then
          echo "Could not find the 'report-outdated-versions' Job in this workflow run"
          exit 1
        fi
        gh api --allow-escape-sequences "/repos/${GITHUB_REPOSITORY}/actions/jobs/${job_id}/logs" > job.log

        assert_logged() {
          if ! grep -qF -- "$1" job.log; then
            echo "Expected the Job log to contain: $1"
            echo "--- support-status output found instead ---"
            grep -E '##\[warning\]|:octagonal_sign:|<p>:warning:|<p>:information_source:' job.log || echo "(none)"
            exit 1
          fi
        }
        refute_logged() {
          if grep -qF -- "$1" job.log; then
            echo "Did not expect the Job log to contain: $1"
            exit 1
          fi
        }

        # The runner renders '::warning::' into the log as '##[warning]'.
        assert_logged "##[warning]Gradle 7.6.4 is end-of-life"

        # The job summary is echoed to the log, so the rendered report can be checked directly.
        assert_logged ":octagonal_sign: Gradle 7.6.4 is end-of-life</summary>"
        assert_logged "Gradle security subscription</a>"

        if [ -n "${UNPATCHED}" ]; then
          warned="${UNMAINTAINED}, ${UNPATCHED}"
        else
          warned="${UNMAINTAINED}"
        fi
        assert_logged ":warning: <strong>${warned}</strong> Unmaintained — update Gradle to at least <strong>${KNOWN_LATEST}</strong>"
        assert_logged ":information_source: <strong>${MAINTENANCE}</strong> — Maintenance only. Update Gradle to at least <strong>${KNOWN_LATEST}</strong>"

        # The maintained line is current, so it must not be warned about.
        refute_logged "<strong>${MAINTENANCE}</strong> Unmaintained"
